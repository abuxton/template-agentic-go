version: '3'

dotenv: [.env]

vars:
  APP: agent
  BIN_DIR: bin
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.10.0

tasks:
  default:
    desc: Run tests and build the CLI
    cmds:
      - task: test
      - task: build

  build:
    desc: Build the agent CLI
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/{{.APP}} ./cmd/agent

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  test-race:
    desc: Run tests with the race detector
    cmds:
      - go test -race ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  format:
    desc: Verify Go formatting
    cmds:
      - test -z "$(gofmt -l .)"

  lint:
    desc: Run the pinned golangci-lint version
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}} run --timeout 5m

  vuln:
    desc: Run the pinned govulncheck version
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} ./...

  quality:
    desc: Run tests and static quality checks
    cmds:
      - task: test
      - task: test-race
      - task: vet
      - task: format
      - task: lint
      - task: vuln

  ci:
    desc: Run the complete local CI workflow
    cmds:
      - task: quality
      - task: build

  run:
    desc: Run the agent CLI with PROMPT
    requires:
      vars:
        - PROMPT
    cmds:
      - go run ./cmd/agent "{{.PROMPT}}"

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}
